[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morph-exact"
version = "0.2.0"
description = "Certificate-carrying self-abstracting computation prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "dd>=0.6.0", "z3-solver>=4.13", "psutil>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["morph_exact*", "morph_lift*"]
